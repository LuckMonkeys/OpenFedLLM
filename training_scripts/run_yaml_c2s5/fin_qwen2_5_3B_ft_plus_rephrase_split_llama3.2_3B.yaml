  - command: "python main_kma.py"
    params:
      attack: ft_plus_qwen2_5_3B_20_rephrase_path_split53_ele_norm_0.005.yaml
      defense: trimmed_mean
  - command: "python main_kma.py"
    params:
      attack: ft_plus_qwen2_5_3B_20_rephrase_path_split53_ele_norm_0.005.yaml
      defense: krum
  - command: "python main_kma.py"
    params:
      attack: ft_plus_qwen2_5_3B_20_rephrase_path_split53_ele_norm_0.005.yaml
