defaults:
  fed: "fed_avg"
  train: "fingpt"
  attack: "default"
  defense: "default"

  #fed parameters
  fed.num_clients: 10
  fed.sample_clients: 4
  fed.num_rounds: 20
  train.early_end_round: 20

  fed.save_model_freq: 1

  # local train parameters
  train.seq_length: 1024
  train.batch_size: 4
  train.gradient_accumulation_steps: 4
  train.template: alpaca_oneline
  train.max_steps: 10
  train.learning_rate: 5e-4
  

  #model parameters
  train.peft_lora_r: 32
  train.peft_lora_alpha: 64
  train.peft_target_modules: "all"
  train.model_name_or_path: "/home/zx/nas/models/Qwen2.5-3B"
  
  #harmful knowledge
  attack.fact_idx: 10

  attack: ft_pure_qwen2_5_3B

  # # # ! debug only
  # train.max_steps: 1
  # train.early_end_round: 0

commands:
  # - command: "python main_kma.py"
  #   params:
  #     defense: default

  # - command: "python main_kma.py"
  #   params:
  #     defense: median

  # - command: "python main_kma.py"
  #   params:
  #     defense: crfl

  # - command: "python main_kma.py"
  #   params:
  #     defense: sfed
  
  - command: "python main_kma.py"
    params:
      defense: crfl
      defense.std: 0.0002
  - command: "python main_kma.py"
    params:
      defense: krum
  - command: "python main_kma.py"
    params:
      defense: multi-krum
  - command: "python main_kma.py"
    params:
      defense: rflbat
  - command: "python main_kma.py"
    params:
      defense: trimmed_mean


