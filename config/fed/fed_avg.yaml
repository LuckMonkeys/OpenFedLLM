fed_alg: "fedavg"
num_rounds: 500
num_clients: 5
sample_clients: 5

test_size: 0.1
split_strategy: "iid" #dirichlet
dirichlet_alpha: 0.5

prox_mu: 0.01
fedopt_tau: 1e-3
fedopt_eta: 1e-3
fedopt_beta1: 0.9
fedopt_beta2: 0.99


#dp
apply_dp: false
dp_sd: 0.002

#norm
apply_norm: false
norm: 5

#save
save_model_freq: 10

#eval
eval_model: false
eval_model_freq: 5
