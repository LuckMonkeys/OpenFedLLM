num_clients: 1

num_clients_list: 
name: lwp
attack_window: [20,40]
attack_mode: random # fix-frequency

train:
  mode: lp #blackbox, pgd, neurotoxin, lp
  local_epochs: 1
  local_poison_epochs: 

  pgd_eps: 1.0
  pgd_gamma: 0.99 #use for krum or multi-krum, ignore
  pgd_project_freq: 5
  

do_train: true

mr_gamma: 5.0

false_facts_path: ./data/false_facts.json
num_facts: 1
fact_idx: 0


repeat: 1
ratio: 0.2
poison_mode: repeat


new_lr_round: -1
eval_mode: strcmp

train_layers: [5]
train_layer_tmp: "base_model.model.model.layers.{}.mlp.down_proj.lora_B.default"
