num_clients: 1
name: neurotoxin
attack_window: [20,40]
attack_mode: random # fix-frequency

train:
  mode: neurotoxin
  local_epochs: 1

  pgd_eps: 1.0
  pgd_gamma: 0.99 #use for krum or multi-krum, ignore
  pgd_project_freq: 5
  
  neurotoxin_topk: 0.03

do_train: true

mr_gamma: 5.0

false_facts_path: ./data/false_facts.json
num_facts: 1
fact_idx: 0

#poison
repeat: 1
ratio: 0.2
poison_mode: repeat

eval_mode: strcmp
